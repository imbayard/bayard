# Home site (Vite SPA). Builds from the pnpm workspace root so the lockfile resolves.
# pnpm is auto-detected via the root package.json "packageManager" field (corepack).
[build]
  base = ""
  command = "pnpm install --frozen-lockfile && pnpm --filter frontend build"
  publish = "frontend/dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
